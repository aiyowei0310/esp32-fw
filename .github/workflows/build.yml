name: Build LVGL firmware (ESP32-S3-Touch-LCD-4)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip

      - name: Install python packages for the builder
        run: pip install toml

      - name: Clone lvgl_micropython
        run: git clone --recursive --depth 1 https://github.com/kdschlosser/lvgl_micropython.git

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          cd lvgl_micropython
          python3 make.py --toml=../config/lcd4_mcu.toml 2>&1 | tee ../build_log.txt

      - name: Locate firmware
        if: always()
        id: fw
        shell: bash
        run: |
          set -x
          ls -l lvgl_micropython/build/ || true
          # 只认 builder 打好的合并镜像，绝不按 *build* 模糊匹配（会抓到几十字节的碎片）
          BIN=$(ls -S lvgl_micropython/build/lvgl_micropy_*.bin 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find lvgl_micropython/build -maxdepth 2 -name "*.bin" -size +1M | head -1)
          fi
          echo "picked: $BIN"
          [ -n "$BIN" ] || { echo "NO FIRMWARE FOUND"; exit 1; }
          cp "$BIN" firmware.bin
          SIZE=$(stat -c%s firmware.bin)
          echo "firmware.bin = $SIZE bytes"
          [ "$SIZE" -gt 1000000 ] || { echo "SUSPICIOUSLY SMALL FIRMWARE"; exit 1; }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            firmware.bin
            build_log.txt
          if-no-files-found: warn

      - name: Publish to release
        if: hashFiles('firmware.bin') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fw
          name: firmware
          files: firmware.bin
          make_latest: true
