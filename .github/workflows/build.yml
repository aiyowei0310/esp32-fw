name: Build LVGL firmware (ESP32-S3-Touch-LCD-4)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Clone lvgl_micropython
        run: git clone --recursive --depth 1 https://github.com/kdschlosser/lvgl_micropython.git

      - name: Build firmware
        run: |
          cd lvgl_micropython
          python3 make.py esp32 BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT \
            DISPLAY=rgb_display INDEV=gt911 \
            --toml=../config/lcd4_mcu.toml 2>&1 | tee build_log.txt

      - name: Locate firmware
        id: fw
        run: |
          BIN=$(find . -name "*.bin" -path "*build*" | sort | head -1)
          echo "Found: $BIN"
          [ -n "$BIN" ] || { echo "NO FIRMWARE FOUND"; find . -maxdepth 3 -name "*.bin"; exit 1; }
          cp "$BIN" firmware.bin
          cp lvgl_micropython/build_log.txt build_log.txt 2>/dev/null || true
          echo "dir=$(pwd)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware.bin
            build_log.txt

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fw
          name: firmware
          files: firmware.bin
          make_latest: true
