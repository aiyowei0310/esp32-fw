# 微雪 ESP32-S3-Touch-LCD-4 (V4.0, N16R8) — 保守基础配置
# 目标：先让它稳定启动。120MHz PSRAM、从 PSRAM 取指令这些优化等跑通后再逐个加回。
# 屏幕引脚/初始化不在这里，全部放 Python 运行时（panel/ 目录）。
[MCU.esp32]
BOARD = "ESP32_GENERIC_S3"
BOARD_VARIANT = "SPIRAM_OCT"
flash_size = 16
# REPL 放在硬件 USB-Serial/JTAG 上（就是烧录用的那个口），固件崩了也能看到日志
enable_jtag_repl = 'y'
enable_cdc_repl = 'n'
enable_uart_repl = 'n'
CONFIG_FREERTOS_HZ = 1000
CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240 = "y"
